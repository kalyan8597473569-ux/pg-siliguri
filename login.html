<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Siliguri Stay</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="login-page">

<div class="login-container">
  <img src="logo.png" alt="Siliguri Stay Logo" class="auth-logo">

  <h1>Welcome to Siliguri Stay</h1>
  <p>Select how you want to continue</p>

  <div class="role-selection">
    <button class="role-btn" onclick="location.href='tenant-auth.html'">
      🎓<br><strong>Student / Tenant</strong>
      <span>Looking for a PG</span>
    </button>

    <button class="role-btn" onclick="location.href='owner-auth.html'">
      🏠<br><strong>PG Owner</strong>
      <span>Manage my PGs</span>
    </button>
  </div>
</div>

</body>
</html>
