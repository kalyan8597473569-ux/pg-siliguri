<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PG Details | Siliguri Stay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo-area">
    <img src="logo.png" class="site-logo">
    <div class="brand-text">
      <span class="title">Siliguri Stay</span>
      <span class="subtitle">Find Your Stay</span>
    </div>
  </div>

  <nav>
    <a href="catalogue.html">Find PGs</a>
  </nav>

  <div class="auth-buttons">
    <a href="login.html" class="btn-register">Login / Register</a>
  </div>
</header>

<!-- PG DETAIL -->
<section class="pg-detail">

  <!-- IMAGE -->
  <div class="pg-image">
    <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2" alt="PG Room">
  </div>

  <!-- INFO -->
  <div class="pg-info-detail">

    <h1>Green View PG</h1>
    <p class="pg-location">📍 Bagdogra, Siliguri</p>

    <div class="pg-price">
      ₹5,500 <span>/ month</span>
    </div>

    <div class="pg-status available">
      2 Beds Available
    </div>

    <!-- AMENITIES -->
    <div class="amenities">
      <span>🍽 Food</span>
      <span>📶 WiFi</span>
      <span>🧹 Housekeeping</span>
      <span>🚿 Attached Washroom</span>
    </div>

    <!-- RULES -->
    <div class="pg-rules">
      <h3>House Rules</h3>
      <ul>
        <li>No smoking</li>
        <li>Entry till 10 PM</li>
        <li>Visitors allowed in common area</li>
      </ul>
    </div>

    <!-- CTA -->
    <button class="btn-register" onclick="handleBooking()">
      Book / Rent this PG
    </button>

  </div>
</section>

<script src="script.js"></script>
</body>
</html>
